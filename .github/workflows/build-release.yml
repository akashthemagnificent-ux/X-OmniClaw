name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Release signing uses keystore.jks in the repo root (see app/build.gradle).
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          else
            keytool -genkeypair -v -keystore keystore.jks \
              -storepass android -keypass android -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=X-OmniClaw Fork, OU=Dev, O=Dev, L=NA, ST=NA, C=US"
          fi

      - name: Build release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: X-OmniClaw-release
          path: releases/*.apk
          if-no-files-found: error
